# Hedwig production stack: MailFlow + the Hedwig worker and pgvector.
#
#   cp .env.hedwig.example .env        # fill in the secrets
#   docker compose -f docker-compose.hedwig.yml up -d --build
#
# Every Hedwig knob can be set here as HEDWIG_<KEY> (see backend/src/hedwig/config.js) and later
# overridden per install in Settings → Hedwig → Models & config, and per user where allowed.
name: hedwig

x-backend-env: &backend-env
  NODE_ENV: production
  SESSION_SECRET: ${SESSION_SECRET}
  APP_URL: ${APP_URL:-}
  FRONTEND_URL: ${APP_URL:-}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-mailflow}
  DB_USER: ${DB_USER:-mailflow}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_URL: redis://redis:6379
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  IMAP_MAX_PERSISTENT_PER_HOST: ${IMAP_MAX_PERSISTENT_PER_HOST:-}
  # Outlook.com / Microsoft 365 OAuth (docs/hedwig/ACCOUNTS-MICROSOFT.md). Empty = not configured
  # here; Settings → Integrations → Microsoft can still supply it at runtime.
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
  MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
  # Gmail / Google Workspace OAuth (docs/hedwig/ACCOUNTS-GOOGLE.md), same rules. The redirect
  # defaults to ${APP_URL}/oauth/google/callback.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  # Hedwig defaults — all overridable in the admin UI.
  HEDWIG_LLM_BASE_URL: ${HEDWIG_LLM_BASE_URL:-http://llm-proxy.cls/v1}
  HEDWIG_LLM_CATALOG_URL: ${HEDWIG_LLM_CATALOG_URL:-http://llm-proxy.cls/catalog.json}
  HEDWIG_LLM_MODELS_FAST: ${HEDWIG_LLM_MODELS_FAST:-google/gemma-4-12B-it-qat-w4a16-ct}
  HEDWIG_LLM_MODELS_LONG: ${HEDWIG_LLM_MODELS_LONG:-Qwen/Qwen3.8-Flash-Next}
  HEDWIG_LLM_MODELS_AGENT: ${HEDWIG_LLM_MODELS_AGENT:-Qwen/Qwen3.8-Flash-Next}
  HEDWIG_LLM_FALLBACK_MODEL: ${HEDWIG_LLM_FALLBACK_MODEL:-}
  HEDWIG_LLM_FALLBACK_AFTER_MS: ${HEDWIG_LLM_FALLBACK_AFTER_MS:-45000}
  HEDWIG_EMBEDDINGS_PROVIDER: ${HEDWIG_EMBEDDINGS_PROVIDER:-openai}
  HEDWIG_EMBEDDINGS_BASE_URL: ${HEDWIG_EMBEDDINGS_BASE_URL:-http://llm-proxy.cls/v1}
  HEDWIG_EMBEDDINGS_MODEL: ${HEDWIG_EMBEDDINGS_MODEL:-bge-m3}
  HEDWIG_EMBEDDINGS_DIMS: ${HEDWIG_EMBEDDINGS_DIMS:-1024}
  # Attachment text for the index (Apache Tika, LXC 165). Off in tests and dev by default.
  HEDWIG_INDEX_TIKA_ENABLED: ${HEDWIG_INDEX_TIKA_ENABLED:-true}
  HEDWIG_INDEX_TIKA_URL: ${HEDWIG_INDEX_TIKA_URL:-http://10.0.1.69:9998}
  # Web search for Ask (the bundled SearXNG service `search` below). Empty turns web search off.
  HEDWIG_ASK_WEB_SEARCH_URL: ${HEDWIG_ASK_WEB_SEARCH_URL-http://search:8080}
  HEDWIG_PLUGINS_DIR: /plugins
  HEDWIG_INSIGHTS_TIMEZONE: ${HEDWIG_INSIGHTS_TIMEZONE:-UTC}
  # Sorting: the decision model (System One via llm-proxy) and how far the classifier may decide alone.
  HEDWIG_SORT_DECISION_ENABLED: ${HEDWIG_SORT_DECISION_ENABLED:-true}
  HEDWIG_SORT_DECISION_MODEL: ${HEDWIG_SORT_DECISION_MODEL:-aer-laya}
  HEDWIG_SORT_CLASSIFIER_DECIDE_ABOVE: ${HEDWIG_SORT_CLASSIFIER_DECIDE_ABOVE:-0.85}
  TZ: ${TZ:-UTC}

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BUILD_SHA: ${GIT_SHA:-dev}
        VITE_EMAIL_DIV_RENDER: ${VITE_EMAIL_DIV_RENDER:-false}
        NGINX_BASE: ${NGINX_BASE:-nginx:alpine}
    image: hedwig-frontend:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-443}:443"
      - "${APP_HTTP_PORT:-80}:80"
    volumes:
      - ./certs:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [hedwig]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_SHA: ${GIT_SHA:-dev}
    image: hedwig-backend:local
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 3000
    volumes:
      - plugins:/plugins
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [hedwig]

  # Pipeline, jobs and schedules. Same image as the backend, no IMAP connections.
  hedwig-worker:
    image: hedwig-backend:local
    restart: unless-stopped
    command: ["node", "src/hedwig/worker.js"]
    environment:
      <<: *backend-env
    volumes:
      - plugins:/plugins
    depends_on:
      backend:
        condition: service_healthy
    networks: [hedwig]

  # Web search for Ask (SearXNG's JSON API). Internal only: no published port; the backend reaches
  # it as http://search:8080. Engines and the reasons for them: deploy/searxng/settings.yml.
  search:
    image: searxng/searxng:2026.9.30-a9d990033
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${HEDWIG_SEARXNG_SECRET:-hedwig-internal-searxng}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [hedwig]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mailflow}
      POSTGRES_USER: ${DB_USER:-mailflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mailflow} -d ${DB_NAME:-mailflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [hedwig]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [hedwig]

volumes:
  postgres_data:
  redis_data:
  plugins:

networks:
  hedwig:
    driver: bridge
